# =========================================================================
# Chowra Logistics and Couriers Limited — Prometheus Scrape Configuration
# Prometheus monitoring configuration
# =========================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'chowra-control-tower-monitor'
    environment: 'production-demo'
    region: 'ap-south-1'

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'chowra-web'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['chowra-web:3000']
        labels:
          app: 'chowra-logistics'
          env: 'production'
          tier: 'frontend'

  - job_name: 'chowra-dispatch-telemetry'
    scrape_interval: 5s
    static_configs:
      - targets: ['chowra-web:3000']
        labels:
          subsystem: 'gps-linehaul-feed'
          hub: 'BOM-01'

  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - logistics-production
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: (.+)
        replacement: $1
