# =========================================================================
# Chowra Logistics and Couriers Limited — Kubernetes Deployment
# System Architecture & Infrastructure: Chowra Engineering Team
# =========================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: chowra-logistics-deployment
  namespace: logistics-production
  labels:
    app.kubernetes.io/name: chowra-logistics
    app.kubernetes.io/instance: chowra-prod-01
    app.kubernetes.io/version: "2.4.0"
    app.kubernetes.io/component: web-frontend
    chowra.com/environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: chowra-logistics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chowra-logistics
        app.kubernetes.io/instance: chowra-prod-01
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
        chowra.internal/environment: "production"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: chowra-web
          image: chowra-logistics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: chowra-logistics-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
